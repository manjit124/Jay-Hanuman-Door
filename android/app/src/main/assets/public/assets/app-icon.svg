<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="doorWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="#1c1917" />

  <!-- Outer Wooden Arch Frame -->
  <path d="M 120 440 L 120 200 A 136 136 0 0 1 392 200 L 392 440 Z" fill="url(#doorWood)" stroke="url(#goldTrim)" stroke-width="12" filter="url(#shadow)"/>

  <!-- Inner Door Panels (Double Door style) -->
  <!-- Left Leaf -->
  <rect x="144" y="210" width="106" height="210" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="4"/>
  <rect x="156" y="224" width="82" height="84" rx="6" fill="#451a03" stroke="#b45309" stroke-width="3"/>
  <rect x="156" y="322" width="82" height="84" rx="6" fill="#451a03" stroke="#b45309" stroke-width="3"/>

  <!-- Right Leaf -->
  <rect x="262" y="210" width="106" height="210" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="4"/>
  <rect x="274" y="224" width="82" height="84" rx="6" fill="#451a03" stroke="#b45309" stroke-width="3"/>
  <rect x="274" y="322" width="82" height="84" rx="6" fill="#451a03" stroke="#b45309" stroke-width="3"/>

  <!-- Brass Door Handles / Handles Ring -->
  <circle cx="236" cy="315" r="8" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
  <circle cx="276" cy="315" r="8" fill="#fef08a" stroke="#d97706" stroke-width="2"/>

  <!-- Top Arch Motif / Sunburst Crown -->
  <path d="M 220 180 Q 256 140 292 180 Z" fill="url(#goldTrim)" />
  <circle cx="256" cy="148" r="10" fill="#fef08a" />

  <!-- Bell Indicator Badge on Top Right -->
  <g transform="translate(340, 60)">
    <circle cx="44" cy="44" r="44" fill="#d97706" stroke="#fef08a" stroke-width="6" />
    <path d="M 44 24 C 36 24 30 30 30 38 L 30 50 L 24 56 L 24 60 L 64 60 L 64 56 L 58 50 L 58 38 C 58 30 52 24 44 24 Z M 40 64 C 40 66 42 68 44 68 C 46 68 48 66 48 64 Z" fill="#ffffff" />
  </g>
</svg>
