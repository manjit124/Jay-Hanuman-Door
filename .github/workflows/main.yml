name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - apk
          - aab

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # 3. Bun
      # --------------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --------------------------------------------------
      # 4. Java
      # --------------------------------------------------
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 5. Android SDK
      # IMPORTANT:
      # Do NOT use android-actions/setup-android@v3 here.
      # It is causing the obsolete "tools" package error.
      # --------------------------------------------------
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_HOME"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # --------------------------------------------------
      # 6. Verify Android SDK
      # --------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK verification successful."

      # --------------------------------------------------
      # 7. Install Dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ]; then
            echo "bun.lock found."
            bun install --frozen-lockfile || bun install
          elif [ -f "package-lock.json" ]; then
            echo "package-lock.json found."
            npm ci
          else
            echo "No lock file found. Installing with npm."
            npm install
          fi

      # --------------------------------------------------
      # 8. Build Web Application
      # --------------------------------------------------
      - name: Build Web Application
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ]; then
            bun run build
          else
            npm run build
          fi

      # --------------------------------------------------
      # 9. Verify Android Project
      # --------------------------------------------------
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: Android Gradle project is missing."
            exit 1
          fi

          echo "Android project found."

      # --------------------------------------------------
      # 10. Capacitor Sync
      # --------------------------------------------------
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e
          npx cap sync android

      # --------------------------------------------------
      # 11. Setup Gradle Wrapper
      # --------------------------------------------------
      - name: Prepare Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing. Creating Gradle 8.11.1 wrapper."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.11.1
            else
              echo "Gradle command not found."
              exit 1
            fi
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready."
          ./gradlew --version

      # --------------------------------------------------
      # 12. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' }}
        working-directory: android
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      # --------------------------------------------------
      # 13. Build Release AAB
      # --------------------------------------------------
      - name: Build Release AAB
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' }}
        working-directory: android
        shell: bash
        run: |
          set -e
          ./gradlew bundleRelease --stacktrace

      # --------------------------------------------------
      # 14. Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' }}
        working-directory: android
        shell: bash
        run: |
          set -e
          ./gradlew assembleRelease --stacktrace

      # --------------------------------------------------
      # 15. Decode Keystore if configured
      # --------------------------------------------------
      - name: Prepare Release Keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          test -f android/app/release.keystore

          echo "Release keystore prepared."

      # --------------------------------------------------
      # 16. Sign Release AAB
      # --------------------------------------------------
      - name: Sign Release AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$AAB" ]; then
            jarsigner \
              -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
              "$AAB" \
              "$KEY_ALIAS"

            echo "Signed AAB created successfully."
          else
            echo "Release AAB not found."
          fi

      # --------------------------------------------------
      # 17. Sign Release APK
      # --------------------------------------------------
      - name: Sign Release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -f "$APK" ]; then

            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

            if [ -z "$APKSIGNER" ]; then
              echo "ERROR: apksigner not found."
              exit 1
            fi

            "$APKSIGNER" sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/app-release-signed.apk \
              "$APK"

            echo "Signed APK created successfully."

          else
            echo "Unsigned release APK not found."
          fi

      # --------------------------------------------------
      # 18. Upload Debug APK
      # --------------------------------------------------
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 19. Upload Release AAB
      # --------------------------------------------------
      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 20. Upload Release APK
      # --------------------------------------------------
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 21. Build Summary
      # --------------------------------------------------
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "JAI HANUMAN DOOR - ANDROID BUILD"
          echo "======================================"

          echo ""
          echo "Debug APK:"
          find android/app/build/outputs/apk/debug -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "Release APK:"
          find android/app/build/outputs/apk/release -name "*.apk" -print 2>/dev/null || true

          echo ""
          echo "Release AAB:"
          find android/app/build/outputs/bundle/release -name "*.aab" -print 2>/dev/null || true

          echo ""
          echo "Build workflow finished."
