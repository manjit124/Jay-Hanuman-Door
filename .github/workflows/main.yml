
name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found on the runner."
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Decode Release Keystore
        shell: bash
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${KS_BASE64:-}" ]; then
            echo "::error::Release keystore secret is missing."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$KS_BASE64" | tr -d '\r\n ' \
            | base64 --decode > android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          echo "Release keystore decoded successfully."

      - name: Validate Signing Credentials
        shell: bash
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${STORE_PASS:-}" ] || \
             [ -z "${ALIAS_NAME:-}" ] || \
             [ -z "${KEY_PASS:-}" ]; then
            echo "::error::One or more signing secrets are missing."
            exit 1
          fi

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$STORE_PASS" \
            -alias "$ALIAS_NAME" >/dev/null

          echo "Signing credentials validated."

      - name: Build Signed Release AAB and APK
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon bundleRelease assembleRelease --stacktrace

      - name: Verify Release AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB_FILE" ]; then
            echo "::error::Release AAB not found or empty."
            exit 1
          fi

          if ! unzip -Z1 "$AAB_FILE" \
            | grep -qE '^META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            echo "::error::AAB signature block not found."
            exit 1
          fi

          jarsigner -verify "$AAB_FILE"
          keytool -printcert -jarfile "$AAB_FILE"

          echo "AAB signature checks completed."

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK not found or empty."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_FILE"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
