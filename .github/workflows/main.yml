name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk
          - aab

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install Dependencies
        run: |
          if command -v bun >/dev/null 2>&1 && [ -f "bun.lock" ]; then
            echo "Installing dependencies with Bun..."
            bun install --frozen-lockfile || bun install
          else
            echo "Installing dependencies with NPM..."
            npm install
          fi

      - name: Build Web Application
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun run build
          else
            npm run build
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Prepare Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || github.event_name == 'push' }}
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB (Google Play Bundle)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' || github.event_name == 'push' }}
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Build Release APK (Unsigned / Direct Install)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || github.event_name == 'push' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace || echo "assembleRelease completed"

      - name: Sign Release AAB (if Secrets are configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Decoding keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
              android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
            echo "Signed AAB created successfully."
          fi

      - name: Sign Release APK (if Secrets are configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/app-release-signed.apk \
              android/app/build/outputs/apk/release/app-release-unsigned.apk
            echo "Signed APK created successfully."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
