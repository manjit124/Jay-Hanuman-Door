
name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - apk
          - aab

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.11.1"

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Setup Java 21 (matches app/build.gradle)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install Android packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")"
          fi

          echo "Using Android SDK: $SDK_ROOT"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # 8. Install project dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "Installing with Bun"
            bun install --frozen-lockfile

          elif [ -f "package-lock.json" ]; then
            echo "Installing with NPM"
            npm ci

          else
            echo "Installing with NPM"
            npm install
          fi

      # 9. Build web application
      - name: Build Web Application
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun run build
          else
            npm run build
          fi

      # 10. Check Android project
      - name: Check Capacitor Android Project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Creating Capacitor Android project"
            npx cap add android
          fi

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: Android Gradle settings missing"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file missing"
            exit 1
          fi

      # 11. Sync Capacitor plugins
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e
          npx cap sync android

      # 12. Fix Cordova plugin Gradle reference
      - name: Fix Cordova Gradle Project Reference
        shell: bash
        run: |
          set -e

          GROOVY="android/settings.gradle"
          KOTLIN="android/settings.gradle.kts"
          PLUGIN_DIR="android/capacitor-cordova-android-plugins"

          if [ -d "$PLUGIN_DIR" ]; then

            if [ -f "$GROOVY" ]; then
              if ! grep -q "include.*capacitor-cordova-android-plugins" "$GROOVY"; then
                echo "Adding Cordova plugin include"
                echo "include ':capacitor-cordova-android-plugins'" >> "$GROOVY"
              fi

              echo "Setting Cordova plugin project directory"
              echo "project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')" >> "$GROOVY"

            elif [ -f "$KOTLIN" ]; then
              if ! grep -q 'include.*capacitor-cordova-android-plugins' "$KOTLIN"; then
                echo 'include(":capacitor-cordova-android-plugins")' >> "$KOTLIN"
              fi

              echo 'project(":capacitor-cordova-android-plugins").projectDir = File("./capacitor-cordova-android-plugins/")' >> "$KOTLIN"
            fi
          else
            echo "No Cordova plugin project directory found; skipping"
          fi

      # 13. Set correct Android SDK path
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          echo "sdk.dir=$SDK_ROOT" > android/local.properties

          echo "Android SDK configured:"
          cat android/local.properties

      # 14. Prepare Gradle wrapper
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd android

          if [ ! -f "gradlew" ] || \
             [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper"
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

          chmod +x gradlew
          ./gradlew --no-daemon --version

      # 15. Verify Android project
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/local.properties

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle configuration missing"
            exit 1
          fi

          echo "Android project verification passed"

      # 16. Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace

      # 17. Build Release AAB
      - name: Build Release AAB
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'aab' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon bundleRelease --stacktrace

      # 18. Build Release APK
      - name: Build Release APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease --stacktrace

      # 19. Sign release files if keystore secrets exist
      - name: Sign Release Files If Keystore Exists
        if: ${{ success() }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "Keystore secrets incomplete or missing."
            echo "Release files may be unsigned."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$AAB" ]; then
            jarsigner \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
              "$AAB" "$KEY_ALIAS"

            jarsigner -verify \
              android/app/build/outputs/bundle/release/app-release-signed.aab
          fi

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -f "$APK" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner | sort -V | tail -n 1)"

            if [ -z "$APKSIGNER" ]; then
              echo "ERROR: apksigner not found"
              exit 1
            fi

            "$APKSIGNER" sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/app-release-signed.apk \
              "$APK"

            "$APKSIGNER" verify \
              android/app/build/outputs/apk/release/app-release-signed.apk
          fi

      # 20. Upload Debug APK
      - name: Upload Debug APK
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 21. Upload Release AAB
      - name: Upload Release AAB
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'aab') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      # 22. Upload Release APK
      - name: Upload Release APK
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 23. Build summary
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Jai Hanuman Door Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d android/app/build/outputs ]; then
            find android/app/build/outputs -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No build outputs created." >> "$GITHUB_STEP_SUMMARY"
          fi
