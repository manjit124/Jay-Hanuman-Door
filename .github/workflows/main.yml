
name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - apk
          - aab

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Setup Java
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 5. Setup Android SDK using the runner SDK manager
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found on runner."
            find "$ANDROID_HOME" -maxdepth 5 -type f \
              -name sdkmanager -print || true
            exit 1
          fi

          echo "Using $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."

      # 6. Verify SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK verification successful."

      # 7. Install dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ]; then
            echo "Installing with Bun"
            bun install --frozen-lockfile
          elif [ -f "bun.lockb" ]; then
            echo "Installing with Bun"
            bun install
          elif [ -f "package-lock.json" ]; then
            echo "Installing with npm ci"
            npm ci
          else
            echo "Installing with npm"
            npm install
          fi

      # 8. Build web application
      - name: Build Web Application
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun run build
          else
            npm run build
          fi

      # 9. Check Android project
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android directory is missing."
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: Android Gradle settings file is missing."
            exit 1
          fi

          echo "Android project found."

      # 10. Sync Capacitor
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e
          npx cap sync android

      # 11. Prepare Gradle wrapper
      - name: Prepare Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ] || \
             [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.11.1
            else
              echo "ERROR: Gradle wrapper is missing and Gradle is unavailable."
              exit 1
            fi
          fi

          chmod +x gradlew
          ./gradlew --version

      # 12. Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' }}
        working-directory: android
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      # 13. Build Release AAB
      - name: Build Release AAB
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' }}
        working-directory: android
        shell: bash
        run: |
          set -e
          ./gradlew bundleRelease --stacktrace

      # 14. Build Release APK
      - name: Build Release APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' }}
        working-directory: android
        shell: bash
        run: |
          set -e
          ./gradlew assembleRelease --stacktrace

      # 15. Prepare signing keystore if secrets exist
      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore configured. Signing will be skipped."
            exit 0
          fi

          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore

          test -s android/app/release.keystore
          echo "Keystore prepared."

      # 16. Sign AAB if signing secrets are configured
      - name: Sign Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ] || \
             [ ! -s android/app/release.keystore ]; then
            echo "Signing secrets or keystore missing. Skipping AAB signing."
            exit 0
          fi

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "AAB not found. Skipping signing."
            exit 0
          fi

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
            "$AAB" \
            "$KEY_ALIAS"

          echo "Signed AAB created."

      # 17. Sign APK if signing secrets are configured
      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ] || \
             [ ! -s android/app/release.keystore ]; then
            echo "Signing secrets or keystore missing. Skipping APK signing."
            exit 0
          fi

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "Unsigned APK not found. Skipping signing."
            exit 0
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks android/app/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            "$APK"

          echo "Signed APK created."

      # 18. Upload Debug APK
      - name: Upload Debug APK Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 19. Upload Release AAB
      - name: Upload Release AAB Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      # 20. Upload Release APK
      - name: Upload Release APK Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 21. Build summary
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "=================================="
          echo "JAI HANUMAN DOOR - ANDROID BUILD"
          echo "=================================="

          echo "Debug APK:"
          find android/app/build/outputs/apk/debug \
            -name "*.apk" -print 2>/dev/null || true

          echo "Release APK:"
          find android/app/build/outputs/apk/release \
            -name "*.apk" -print 2>/dev/null || true

          echo "Release AAB:"
          find android/app/build/outputs/bundle/release \
            -name "*.aab" -print 2>/dev/null || true
