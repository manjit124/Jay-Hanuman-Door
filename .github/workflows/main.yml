
name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - apk
          - aab

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.11.1"

    steps:
      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Java 21 (project uses Java 21)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 5. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 6. Configure existing Android SDK
      # Do not use android-actions/setup-android here.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found at $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "sdk.dir=$SDK_ROOT" > android/local.properties

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "Android SDK setup completed."

      # 7. Install dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun install --frozen-lockfile || bun install
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      # 8. Build website
      - name: Build Web Application
        shell: bash
        run: |
          set -e

          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun run build
          else
            npm run build
          fi

      # 9. Check Capacitor project
      - name: Check Capacitor Android Project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file missing"
            exit 1
          fi

      # 10. Sync Capacitor
      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -e
          npx cap sync android

      # 11. Fix Cordova project reference
      - name: Fix Cordova Gradle Project Reference
        shell: bash
        run: |
          set -e

          SETTINGS="android/settings.gradle"
          PLUGIN_DIR="android/capacitor-cordova-android-plugins"

          if [ -d "$PLUGIN_DIR" ] && [ -f "$SETTINGS" ]; then
            if ! grep -q "include.*capacitor-cordova-android-plugins" "$SETTINGS"; then
              echo "include ':capacitor-cordova-android-plugins'" >> "$SETTINGS"
            fi

            if ! grep -q "project(':capacitor-cordova-android-plugins').projectDir" "$SETTINGS"; then
              echo "project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')" >> "$SETTINGS"
            fi
          fi

          echo "Gradle project reference checked."

      # 12. Prepare Gradle Wrapper
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd android

          if [ ! -f "gradlew" ] || \
             [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

          chmod +x gradlew
          ./gradlew --no-daemon --version

      # 13. Verify project
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/local.properties

          echo "Android project verification passed."

      # 14. Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace

      # 15. Build Release AAB
      - name: Build Release AAB
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'aab' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon bundleRelease --stacktrace

      # 16. Build Release APK
      - name: Build Release APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk' }}
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease --stacktrace

      # 17. Sign release outputs if secrets exist
      - name: Sign Release Files If Keystore Exists
        if: ${{ success() }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "Keystore secrets missing; skipping optional signing."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$AAB" ]; then
            jarsigner \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
              "$AAB" "$KEY_ALIAS"

            jarsigner -verify \
              android/app/build/outputs/bundle/release/app-release-signed.aab
          fi

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -f "$APK" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner | sort -V | tail -n 1)"

            if [ -z "$APKSIGNER" ]; then
              echo "ERROR: apksigner not found"
              exit 1
            fi

            "$APKSIGNER" sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/app-release-signed.apk \
              "$APK"

            "$APKSIGNER" verify \
              android/app/build/outputs/apk/release/app-release-signed.apk
          fi

      # 18. Upload Debug APK
      - name: Upload Debug APK
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 19. Upload Release AAB
      - name: Upload Release AAB
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'aab') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      # 20. Upload Release APK
      - name: Upload Release APK
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 21. Build summary
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Jai Hanuman Door Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d android/app/build/outputs ]; then
            find android/app/build/outputs -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No build outputs created." >> "$GITHUB_STEP_SUMMARY"
          fi
