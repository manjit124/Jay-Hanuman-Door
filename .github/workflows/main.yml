
name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - apk
          - aab

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "8.11.1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        shell: bash
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Application
        shell: bash
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun run build
          else
            npm run build
          fi

      - name: Check Capacitor Android Project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "Android project not found."
            npx cap add android
          fi

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then
            echo "Gradle settings file is missing."
            exit 1
          fi

      - name: Sync Capacitor Android
        shell: bash
        run: npx cap sync android

      - name: Fix Cordova Gradle Project Reference
        shell: bash
        run: |
          SETTINGS="android/settings.gradle"
          PLUGIN_DIR="android/capacitor-cordova-android-plugins"

          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "Cordova plugins project folder not generated."
            echo "Check Capacitor plugins and sync output."
            exit 1
          fi

          if [ ! -f "$SETTINGS" ]; then
            echo "settings.gradle is missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")
          content = path.read_text()

          include_line = "include ':capacitor-cordova-android-plugins'"
          project_line = (
              "project(':capacitor-cordova-android-plugins').projectDir = "
              "new File('./capacitor-cordova-android-plugins/')"
          )

          if include_line not in content:
              addition = include_line + "\n" + project_line + "\n"

              marker = "apply from: 'capacitor.settings.gradle'"
              if marker in content:
                  content = content.replace(
                      marker, addition + marker, 1
                  )
              else:
                  content = content.rstrip() + "\n" + addition

          elif project_line not in content:
              content = content.replace(
                  include_line,
                  include_line + "\n" + project_line,
                  1
              )

          path.write_text(content)
          print("Updated settings.gradle:")
          print(content)
          PY

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          cd android

          if [ ! -f "gradlew" ] || \
             [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Verify Android Project
        shell: bash
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -d android/capacitor-cordova-android-plugins

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "App Gradle file is missing."
            exit 1
          fi

          echo "Android project verification passed."

      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk' }}
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Build Release AAB
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'aab' }}
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk' }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Sign Release Files If Keystore Exists
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Keystore not configured. Manual signing skipped."
            exit 0
          fi

          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Keystore secrets are incomplete."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ -f "$AAB" ]; then
            jarsigner \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore android/app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
              "$AAB" "$KEY_ALIAS"

            jarsigner -verify \
              android/app/build/outputs/bundle/release/app-release-signed.aab
          fi

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -f "$APK" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner | sort -V | tail -n 1)

            if [ -z "$APKSIGNER" ]; then
              echo "apksigner not found."
              exit 1
            fi

            "$APKSIGNER" sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/app-release-signed.apk \
              "$APK"

            "$APKSIGNER" verify \
              android/app/build/outputs/apk/release/app-release-signed.apk
          fi

      - name: Upload Debug APK
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release AAB
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'aab') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK
        if: ${{ always() && (github.event_name == 'push' || inputs.build_type == 'all' || inputs.build_type == 'apk') }}
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Jai Hanuman Door Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -d android/app/build/outputs ]; then
            find android/app/build/outputs -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No build artifacts were created." >> "$GITHUB_STEP_SUMMARY"
          fi
