name: Generate Android Upload Keystore (One-Time Setup)

on:
  workflow_dispatch:
    inputs:
      confirm_generation:
        description: 'Type "GENERATE" to confirm. WARNING: Generating a new key replaces your upload credentials. Run only ONCE for initial Google Play setup!'
        required: true
        type: string
        default: 'CANCEL'
      key_alias_override:
        description: 'Key Alias override (leave blank to use secrets.ANDROID_KEY_ALIAS or "upload")'
        required: false
        type: string
        default: ''
      keystore_password_input:
        description: 'Keystore Password (leave blank to use secrets.ANDROID_KEYSTORE_PASSWORD)'
        required: false
        type: string
        default: ''
      key_password_input:
        description: 'Key Password (leave blank to use secrets.ANDROID_KEY_PASSWORD or same as Keystore Password)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  generate_keystore:
    name: Generate & Verify Upload Keystore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirm One-Time Action
        shell: bash
        run: |
          set -e
          CONFIRM="${{ inputs.confirm_generation }}"
          if [ "$CONFIRM" != "GENERATE" ]; then
            echo "::error::Generation cancelled. You must enter 'GENERATE' in the workflow prompt to generate a new keystore."
            echo "This safeguard prevents accidental regeneration of existing release keys."
            exit 1
          fi
          echo "One-time generation confirmed."

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate & Verify Upload Keystore
        shell: bash
        env:
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          INPUT_ALIAS: ${{ inputs.key_alias_override }}
          INPUT_STORE_PASS: ${{ inputs.keystore_password_input }}
          INPUT_KEY_PASS: ${{ inputs.key_password_input }}
        run: |
          set -e

          # Resolve key alias
          ALIAS="${SECRET_ALIAS:-${INPUT_ALIAS:-upload}}"
          
          # Resolve passwords
          STORE_PASS="${SECRET_STORE_PASS:-$INPUT_STORE_PASS}"
          KEY_PASS="${SECRET_KEY_PASS:-${INPUT_KEY_PASS:-$STORE_PASS}}"

          # Validate passwords are provided
          if [ -z "$STORE_PASS" ]; then
            echo "::error::Keystore password is required! Please configure ANDROID_KEYSTORE_PASSWORD in GitHub Secrets or supply keystore_password_input."
            exit 1
          fi

          if [ ${#STORE_PASS} -lt 6 ]; then
            echo "::error::Keystore password must be at least 6 characters long."
            exit 1
          fi

          # Mask sensitive credentials so they are never printed in workflow logs
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          mkdir -p output_artifact

          echo "Generating RSA 2048-bit JKS keystore with 10,000 days validity..."
          keytool -genkeypair -v \
            -keystore output_artifact/upload-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Jai Hanuman Door, OU=Mobile, O=Jai Hanuman Door, L=Mumbai, ST=Maharashtra, C=IN"

          echo "=============================================="
          echo "      STRICT KEYSTORE VERIFICATION"
          echo "=============================================="

          if [ ! -s output_artifact/upload-keystore.jks ]; then
            echo "::error::upload-keystore.jks was not created or is empty!"
            exit 1
          fi

          VERIFY_OUTPUT="$(keytool -list -v -keystore output_artifact/upload-keystore.jks -storepass "$STORE_PASS")"

          # Verify Alias
          if echo "$VERIFY_OUTPUT" | grep -Fqi "Alias name: $ALIAS"; then
            echo "✓ Verified alias '$ALIAS' exists in keystore."
          else
            echo "::error::Alias '$ALIAS' not found in keystore!"
            exit 1
          fi

          # Verify Entry Type
          if echo "$VERIFY_OUTPUT" | grep -Fqi "Entry type: PrivateKeyEntry"; then
            echo "✓ Verified Entry type is PrivateKeyEntry."
          else
            echo "::error::Keystore entry is not a PrivateKeyEntry!"
            exit 1
          fi

          # Verify Algorithm & Key Size
          if echo "$VERIFY_OUTPUT" | grep -Fqi "2048-bit RSA key" || echo "$VERIFY_OUTPUT" | grep -Fqi "RSA"; then
            echo "✓ Verified RSA key algorithm."
          else
            echo "::error::Key algorithm is not RSA 2048!"
            exit 1
          fi

          # Extract Public Fingerprints for Play Console / Firebase
          SHA1_FP=$(echo "$VERIFY_OUTPUT" | grep -i "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_FP=$(echo "$VERIFY_OUTPUT" | grep -i "SHA256:" | head -n 1 | awk '{print $2}')

          echo "=============================================="
          echo "      BASE64 ENCODING & TEST ROUNDTRIP"
          echo "=============================================="

          # Encode keystore to Base64 (single line, no line breaks)
          base64 output_artifact/upload-keystore.jks | tr -d '\r\n ' > output_artifact/keystore-base64.txt

          if [ ! -s output_artifact/keystore-base64.txt ]; then
            echo "::error::keystore-base64.txt is empty!"
            exit 1
          fi

          # Test roundtrip decoding
          tr -d '\r\n ' < output_artifact/keystore-base64.txt | base64 --decode > test-roundtrip.keystore
          if ! keytool -list -keystore test-roundtrip.keystore -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::Base64 roundtrip test failed! Decoded file could not be read by keytool."
            rm -f test-roundtrip.keystore
            exit 1
          fi
          rm -f test-roundtrip.keystore
          echo "✓ Base64 roundtrip decode verified successfully."

          # Create metadata info file (NO passwords or private keys inside)
          {
            echo "============================================================"
            echo "Jai Hanuman Door - Android Upload Keystore Info"
            echo "============================================================"
            echo "Key Alias: $ALIAS"
            echo "Algorithm: RSA 2048-bit"
            echo "Validity: 10,000 days"
            echo "SHA1 Certificate Fingerprint: $SHA1_FP"
            echo "SHA256 Certificate Fingerprint: $SHA256_FP"
            echo ""
            echo "NEXT STEPS:"
            echo "1. Open 'keystore-base64.txt' and copy its entire contents."
            echo "2. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions."
            echo "3. Update/Create the secret: ANDROID_KEYSTORE_BASE64 (paste the Base64 string)."
            echo "4. Verify ANDROID_KEY_ALIAS is set to: $ALIAS"
            echo "5. Verify ANDROID_KEYSTORE_PASSWORD is set to the password used."
            echo "6. Verify ANDROID_KEY_PASSWORD is set (or same as keystore password)."
            echo "7. Delete the temporary artifact from the GitHub Actions run page."
            echo "8. Run 'Build Android APK & AAB' to generate your signed app-release.aab!"
            echo "============================================================"
          } > output_artifact/keystore-info.txt

          # Write Step Summary
          echo "## Android Upload Keystore Generated Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Key Alias** | \`$ALIAS\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Key Algorithm** | RSA 2048-bit |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Validity** | 10,000 days |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SHA1 Fingerprint** | \`$SHA1_FP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SHA256 Fingerprint** | \`$SHA256_FP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Instructions to Apply Key:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download the **\`android-upload-keystore-bundle\`** artifact from below." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Extract and open **\`keystore-base64.txt\`**." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Copy the entire Base64 string and paste it into GitHub Secret **\`ANDROID_KEYSTORE_BASE64\`**." >> "$GITHUB_STEP_SUMMARY"
          echo "4. Delete the temporary artifact from this workflow run page for security." >> "$GITHUB_STEP_SUMMARY"
          echo "5. Trigger the **\`Build Android APK & AAB\`** workflow." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Keystore Artifact (Temporary 1-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore-bundle
          path: output_artifact/
          retention-days: 1
          if-no-files-found: error
