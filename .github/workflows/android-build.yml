
name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager executable not found under $ANDROID_HOME."
            exit 1
          fi

          echo "Using Android SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        env:
          VITE_API_BASE_URL: ${{ secrets.PRODUCTION_API_URL || secrets.VITE_API_BASE_URL || secrets.API_URL || vars.PRODUCTION_API_URL || vars.VITE_API_BASE_URL || '' }}
          VITE_APP_URL: ${{ secrets.PRODUCTION_API_URL || secrets.VITE_API_BASE_URL || secrets.API_URL || vars.PRODUCTION_API_URL || vars.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: Decode Release Keystore
        shell: bash
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${KS_BASE64:-}" ]; then
            echo "::error::Missing release keystore secret."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$KS_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode > android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Keystore is empty or could not be decoded."
            exit 1
          fi

          echo "Release keystore decoded successfully."

      - name: Validate Signing Secrets
        shell: bash
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${STORE_PASS:-}" ]; then
            echo "::error::Missing keystore password secret."
            exit 1
          fi

          if [ -z "${ALIAS_NAME:-}" ]; then
            echo "::error::Missing key alias secret."
            exit 1
          fi

          if [ -z "${KEY_PASS:-}" ]; then
            echo "::error::Missing key password secret."
            exit 1
          fi

          keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$STORE_PASS" \
            -alias "$ALIAS_NAME" >/dev/null

          echo "Keystore and alias validation passed."

      - name: Build Signed Release AAB and APK
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon bundleRelease assembleRelease --stacktrace

      - name: Verify Release AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB_FILE="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB_FILE" ]; then
            echo "::error::Release AAB not found or empty: $AAB_FILE"
            exit 1
          fi

          echo "Checking AAB signature and archive integrity..."

          if ! unzip -Z1 "$AAB_FILE" | grep -qE '^META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            echo "::error::AAB signature block not found."
            exit 1
          fi

          jarsigner -verify -verbose -certs "$AAB_FILE"

          CERT_OUTPUT="$(keytool -printcert -jarfile "$AAB_FILE")"

          if ! printf '%s\n' "$CERT_OUTPUT" | grep -q 'SHA256:'; then
            echo "::error::Could not read the AAB signer certificate."
            exit 1
          fi

          echo "AAB signature and integrity verification passed."

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK not found or empty: $APK_FILE"
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner tool not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_FILE"
          echo "APK signature verification passed."

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jai-hanuman-door-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
